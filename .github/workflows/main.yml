name: Build and Release Vaultwarden Windows Binaries

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点自动运行

permissions:
  contents: write
  packages: write

jobs:
  # ==================== 第一步：检查版本更新 ====================
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      stable_version: ${{ steps.get_stable.outputs.version }}
      stable_need_build: ${{ steps.check_stable.outputs.need_build }}
      testing_commit: ${{ steps.get_testing.outputs.commit }}
      testing_commit_short: ${{ steps.get_testing.outputs.commit_short }}
      testing_need_build: ${{ steps.check_testing.outputs.need_build }}
    steps:
      # 1.1 获取最新稳定版本
      - name: Get latest stable version
        id: get_stable
        run: |
          echo "Fetching latest stable release from GitHub API..."
          LATEST=$(curl -s https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r .tag_name)
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest stable version: ${LATEST}"

      # 1.2 检查稳定版是否已构建（智能跳过）
      - name: Check if stable version already built
        id: check_stable
        run: |
          TAG="${{ steps.get_stable.outputs.version }}-windows"
          echo "Checking for existing release: ${TAG}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG})
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Release ${TAG} already exists, skipping build"
            echo "need_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 Release ${TAG} does not exist, will build"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      # 1.3 获取 Testing 版本（主分支最新 commit）
      - name: Get testing version (main branch commit)
        id: get_testing
        run: |
          echo "Fetching latest commit from main branch..."
          COMMIT_SHA=$(git ls-remote https://github.com/dani-garcia/vaultwarden.git main | awk '{print $1}')
          COMMIT_SHORT=$(echo ${COMMIT_SHA} | cut -c1-7)
          echo "commit=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "Latest testing commit: ${COMMIT_SHA} (short: ${COMMIT_SHORT})"

      # 1.4 检查测试版是否需要构建（重大更新检测 + 定期构建）
      - name: Check if testing build is needed
        id: check_testing
        run: |
          TAG="testing-${{ steps.get_testing.outputs.commit_short }}-windows"
          echo "Checking for existing release: ${TAG}"
          
          # 获取最新 commit 的详细信息
          COMMIT_SHA="${{ steps.get_testing.outputs.commit }}"
          COMMIT_INFO=$(curl -s https://api.github.com/repos/dani-garcia/vaultwarden/commits/${COMMIT_SHA})
          COMMIT_MSG=$(echo "$COMMIT_INFO" | jq -r .commit.message)
          COMMIT_DATE=$(echo "$COMMIT_INFO" | jq -r .commit.author.date)
          
          echo "Latest commit: ${COMMIT_MSG}"
          echo "Commit date: ${COMMIT_DATE}"
          
          # 定义重大更新的关键词（可以根据需要调整）
          SIGNIFICANT_KEYWORDS="fix|security|cve|patch|break|change|update|bump|upgrade|feature|add|support|improve|optimize|refactor|new|enhance|resolve|close|issue #[0-9]+"
          
          # 检查是否为重大更新
          if echo "$COMMIT_MSG" | grep -qiE "$SIGNIFICANT_KEYWORDS"; then
            echo "🔍 Significant changes detected!"
            IS_SIGNIFICANT=true
          else
            echo "🔍 Minor changes only (documentation, formatting, tests, etc.)"
            IS_SIGNIFICANT=false
          fi
          
          # 检查 Release 是否存在
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG})
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Release ${TAG} already exists"
            
            # 获取 Release 创建日期
            RELEASE_DATE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG} | jq -r .created_at)
            RELEASE_TIMESTAMP=$(date -d "${RELEASE_DATE}" -u +%s)
            CURRENT_TIMESTAMP=$(date -u +%s)
            
            # 计算天数差
            DAYS_DIFF=$(( ($CURRENT_TIMESTAMP - $RELEASE_TIMESTAMP) / 86400 ))
            
            echo "Release created ${DAYS_DIFF} days ago"
            
            # 决策逻辑：
            # 1. 如果超过7天未构建 → 构建（定期更新）
            # 2. 如果是重大更新 → 构建
            # 3. 其他 → 跳过
            if [ $DAYS_DIFF -ge 7 ]; then
              echo "🔄 Release is older than 7 days, rebuilding (regular update)"
              echo "need_build=true" >> $GITHUB_OUTPUT
            elif [ "$IS_SIGNIFICANT" = true ]; then
              echo "🔄 Significant changes detected, rebuilding"
              echo "need_build=true" >> $GITHUB_OUTPUT
            else
              echo "⏭️ No significant changes and release is recent, skipping"
              echo "need_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "🆕 Release ${TAG} does not exist, will build"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

  # ==================== 第二步：构建稳定版 ====================
  build-stable:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.stable_need_build == 'true' }}
    runs-on: windows-latest
    outputs:
      version: ${{ needs.check-versions.outputs.stable_version }}
    steps:
      - name: Checkout stable version source code
        run: |
          git clone --depth 1 --branch ${{ needs.check-versions.outputs.stable_version }} https://github.com/dani-garcia/vaultwarden.git
          cd vaultwarden
          echo "Checked out version: $(git describe --tags)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup vcpkg and install dependencies
        shell: powershell
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          git -C C:\vcpkg pull
          C:\vcpkg\vcpkg.exe install openssl:x64-windows-static
          C:\vcpkg\vcpkg.exe integrate install
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\x64-windows-static\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows-static\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            vaultwarden/target/
          key: ${{ runner.os }}-cargo-stable-${{ needs.check-versions.outputs.stable_version }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-

      - name: Build stable release binary
        shell: powershell
        run: |
          cd vaultwarden
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --features sqlite --release --target x86_64-pc-windows-msvc

      - name: Prepare stable release files
        run: |
          cd vaultwarden
          New-Item -ItemType Directory -Path "release-files" -Force
          $VERSION = "${{ needs.check-versions.outputs.stable_version }}"
          Copy-Item "target\x86_64-pc-windows-msvc\release\vaultwarden.exe" "release-files\vaultwarden-${VERSION}-windows-x64.exe"
          @"
          Vaultwarden Windows Binary (Stable)
          Version: ${VERSION}
          Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Target: x86_64-pc-windows-msvc
          Features: sqlite
          Source: https://github.com/dani-garcia/vaultwarden/releases/tag/${VERSION}
          "@ | Out-File -FilePath "release-files\README.txt" -Encoding utf8

      - name: Upload stable binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-stable-${{ needs.check-versions.outputs.stable_version }}
          path: vaultwarden/release-files/*
          if-no-files-found: error

  # ==================== 第三步：构建测试版 ====================
  build-testing:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.testing_need_build == 'true' }}
    runs-on: windows-latest
    outputs:
      commit: ${{ needs.check-versions.outputs.testing_commit }}
      commit_short: ${{ needs.check-versions.outputs.testing_commit_short }}
    steps:
      - name: Checkout testing version source code
        run: |
          git clone https://github.com/dani-garcia/vaultwarden.git
          cd vaultwarden
          git checkout ${{ needs.check-versions.outputs.testing_commit }}
          echo "Checked out commit: $(git rev-parse --short HEAD)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup vcpkg and install dependencies
        shell: powershell
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          git -C C:\vcpkg pull
          C:\vcpkg\vcpkg.exe install openssl:x64-windows-static
          C:\vcpkg\vcpkg.exe integrate install
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\x64-windows-static\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows-static\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            vaultwarden/target/
          key: ${{ runner.os }}-cargo-testing-${{ needs.check-versions.outputs.testing_commit_short }}
          restore-keys: |
            ${{ runner.os }}-cargo-testing-

      - name: Build testing release binary
        shell: powershell
        run: |
          cd vaultwarden
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --features sqlite --release --target x86_64-pc-windows-msvc

      - name: Prepare testing release files
        run: |
          cd vaultwarden
          New-Item -ItemType Directory -Path "release-files" -Force
          $COMMIT_SHORT = "${{ needs.check-versions.outputs.testing_commit_short }}"
          $BUILD_DATE = Get-Date -Format 'yyyyMMdd'
          Copy-Item "target\x86_64-pc-windows-msvc\release\vaultwarden.exe" "release-files\vaultwarden-testing-${COMMIT_SHORT}-windows-x64.exe"
          @"
          Vaultwarden Windows Binary (Testing)
          Commit: ${{ needs.check-versions.outputs.testing_commit }}
          Short Commit: ${COMMIT_SHORT}
          Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Target: x86_64-pc-windows-msvc
          Features: sqlite
          Source: https://github.com/dani-garcia/vaultwarden/commit/${{ needs.check-versions.outputs.testing_commit }}
          ⚠️ WARNING: This is a development/testing version.
          It may contain experimental features or bugs.
          Use at your own risk.
          "@ | Out-File -FilePath "release-files\README.txt" -Encoding utf8

      - name: Upload testing binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-testing-${{ needs.check-versions.outputs.testing_commit_short }}
          path: vaultwarden/release-files/*
          if-no-files-found: error

  # ==================== 第四步：创建稳定版 Release ====================
  create-stable-release:
    needs: [check-versions, build-stable]
    if: ${{ needs.check-versions.outputs.stable_need_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download stable binary artifact
        uses: actions/download-artifact@v4
        with:
          name: vaultwarden-stable-${{ needs.check-versions.outputs.stable_version }}
          path: ./stable-binary

      - name: Create Stable Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check-versions.outputs.stable_version }}-windows
          name: Vaultwarden Windows Binary (Stable) ${{ needs.check-versions.outputs.stable_version }}
          body: |
            ## Vaultwarden Windows Binary - Stable Release
            
            This release contains the Windows binary compiled from the official Vaultwarden source code.
            
            ### Features
            - Built with SQLite support
            - Statically linked for easy deployment
            - x64 architecture (x86_64-pc-windows-msvc)
            
            ### Original Release
            https://github.com/dani-garcia/vaultwarden/releases/tag/${{ needs.check-versions.outputs.stable_version }}
            
            ### Installation
            1. Download the `vaultwarden-*.exe` file
            2. Place it in your desired directory
            3. Run it as a service or standalone
          draft: false
          prerelease: false
          files: ./stable-binary/*

  # ==================== 第五步：创建测试版 Release ====================
  create-testing-release:
    needs: [check-versions, build-testing]
    if: ${{ needs.check-versions.outputs.testing_need_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download testing binary artifact
        uses: actions/download-artifact@v4
        with:
          name: vaultwarden-testing-${{ needs.check-versions.outputs.testing_commit_short }}
          path: ./testing-binary

      - name: Create Testing Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: testing-${{ needs.check-versions.outputs.testing_commit_short }}-windows
          name: Vaultwarden Windows Binary (Testing) - ${{ needs.check-versions.outputs.testing_commit_short }}
          body: |
            ## Vaultwarden Windows Binary - Testing Release
            
            ⚠️ **WARNING: This is a development/testing version**
            - Based on the latest main branch commit
            - May contain experimental features or bugs
            - Use at your own risk
            
            ### Build Information
            - **Commit:** ${{ needs.check-versions.outputs.testing_commit }}
            - **Short Commit:** ${{ needs.check-versions.outputs.testing_commit_short }}
            - **Built:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            - **Target:** x86_64-pc-windows-msvc
            - **Features:** sqlite
            
            ### Source
            https://github.com/dani-garcia/vaultwarden/commit/${{ needs.check-versions.outputs.testing_commit }}
            
            ### Installation
            1. Download the `vaultwarden-testing-*.exe` file
            2. Place it in your desired directory
            3. Run it as a service or standalone
          draft: false
          prerelease: true
          files: ./testing-binary/*

  # ==================== 第六步：汇总报告 ====================
  summary:
    needs: [check-versions, build-stable, build-testing, create-stable-release, create-testing-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report
        run: |
          echo "## Vaultwarden Windows Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 Stable Version" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.check-versions.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.check-versions.outputs.stable_need_build == 'true' && '✅ Built' || '⏭️ Skipped (already exists)' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check-versions.outputs.stable_need_build }}" = "true" ]; then
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-versions.outputs.stable_version }}-windows" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🧪 Testing Version" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ needs.check-versions.outputs.testing_commit_short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.check-versions.outputs.testing_need_build == 'true' && '✅ Built' || '⏭️ Skipped (not needed)' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check-versions.outputs.testing_need_build }}" = "true" ]; then
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/testing-${{ needs.check-versions.outputs.testing_commit_short }}-windows" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.check-versions.outputs.stable_need_build }}" = "false" ] && [ "${{ needs.check-versions.outputs.testing_need_build }}" = "false" ]; then
            echo "ℹ️ **No new builds needed. All up to date.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Build completed successfully!**" >> $GITHUB_STEP_SUMMARY
          fi
